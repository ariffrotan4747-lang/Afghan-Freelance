<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="whiteSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4" />

  <!-- Outer Global Connection Orbit Ring -->
  <ellipse cx="256" cy="256" rx="180" ry="80" fill="none" stroke="url(#blueGlow)" stroke-width="4" stroke-dasharray="14 10" transform="rotate(-28 256 256)" opacity="0.65" />
  <circle cx="108" cy="180" r="7" fill="#38bdf8" />
  <circle cx="404" cy="332" r="7" fill="#fbbf24" />

  <!-- Central Afghan Star/Diamond Geometry -->
  <g transform="translate(256, 256)">
    <!-- Subtle 8-point geometric star halo -->
    <path d="M0 -150 L38 -38 L150 0 L38 38 L0 150 L-38 38 L-150 0 L-38 -38 Z" fill="rgba(56, 189, 248, 0.06)" />

    <!-- Mountain Silhouette (Hindu Kush symbol of Afghan resilience) -->
    <path d="M-130 90 L-50 -10 L0 45 L55 -40 L130 90 Z" fill="url(#blueGlow)" opacity="0.9" />
    <path d="M-50 -10 L-20 -50 L10 -5 L0 45 Z" fill="#ffffff" opacity="0.85" />
    <path d="M55 -40 L85 -75 L115 10 L80 15 Z" fill="#ffffff" opacity="0.95" />

    <!-- Tech Code Bracket & Growth Feather (Freelancing / Talent) -->
    <path d="M-90 -30 L-130 20 L-90 70" fill="none" stroke="url(#goldAccent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M90 -30 L130 20 L90 70" fill="none" stroke="url(#goldAccent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Central Global Node / Rising Star -->
    <circle cx="0" cy="-85" r="16" fill="url(#goldAccent)" />
    <path d="M0 -110 L0 -60 M-25 -85 L25 -85" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Base Baseline Wordmark Accent -->
  <circle cx="256" cy="420" r="4" fill="#fbbf24" />
  <circle cx="236" cy="420" r="3" fill="#38bdf8" opacity="0.8" />
  <circle cx="276" cy="420" r="3" fill="#38bdf8" opacity="0.8" />
</svg>
